name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: native
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test

      - name: Release cdylib
        run: cargo build --release

  coil:
    name: coil test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: coil-tls

      - name: Forbid leftover io::__tls import
        working-directory: coil-tls
        run: |
          if grep -R --include='*.hy' -E '^[[:space:]]*use io::__tls' src tests examples; then
            echo "use io::__tls is forbidden in this package"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      # coil comes from the coil-lang `edge` release (a snapshot of its main,
      # rebuilt after every green coil-lang CI run) instead of a source build.
      - name: Install coil (edge)
        uses: ardax-corp/coil-lang/.github/actions/setup-coil@main

      - name: Build libtls.so
        working-directory: coil-tls/native
        run: make artifact

      # Loading a native library needs its hash in coil.lock (or a trusted
      # stem); record the one just built, as coil-sdl's `make write-lock` does.
      - name: Lock libtls
        working-directory: coil-tls
        run: |
          set -euo pipefail
          hash=$(sha256sum native/libtls.so | awk '{print $1}')
          printf '%s\n' '[[package]]' "name = 'tls'" '[[package.native]]' "sha256 = '$hash'" > coil.lock
          cat coil.lock

      - name: Run coil tests
        working-directory: coil-tls
        run: coil test --allow-attach --allow-write --allow-dload tls

      - name: Loopback attach handshake
        working-directory: coil-tls
        run: |
          out=$(coil --allow-attach --allow-net --allow-dload tls examples/loopback.hy)
          echo "$out"
          test "$out" = "ok"
